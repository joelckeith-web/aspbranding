<circle cx="364" cy="146" r="13" fill="#9F4CFF"/>
<text x="364" y="151" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">3</text>
<text x="354" y="184" font-size="13.5" fill="#111827" font-weight="700" text-anchor="start">First two weeks</text>
<text x="354" y="210.0" font-size="12" fill="#4b5563" font-weight="400" text-anchor="start">Let it settle and</text><text x="354" y="226.2" font-size="12" fill="#4b5563" font-weight="400" text-anchor="start">build your list of</text><text x="354" y="242.4" font-size="12" fill="#4b5563" font-weight="400" text-anchor="start">searches to block</text>
<path d="M478 195 l10 0" stroke="#9ca3af" stroke-width="2"/>
<rect x="490" y="110" width="136" height="170" rx="10" fill="#ffffff" stroke="#1E5BD8" stroke-width="2"/>
<rect x="490" y="110" width="136" height="8" rx="4" fill="#1E5BD8"/>
<circle cx="514" cy="146" r="13" fill="#1E5BD8"/>
<text x="514" y="151" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">4</text>
<text x="504" y="184" font-size="13.5" fill="#111827" font-weight="700" text-anchor="start">After two weeks</text>
<text x="504" y="210.0" font-size="12" fill="#4b5563" font-weight="400" text-anchor="start">Add negative</text><text x="504" y="226.2" font-size="12" fill="#4b5563" font-weight="400" text-anchor="start">keywords</text><text x="504" y="242.4" font-size="12" fill="#4b5563" font-weight="400" text-anchor="start">(exclusions only)</text>
<path d="M628 195 l10 0" stroke="#9ca3af" stroke-width="2"/>
