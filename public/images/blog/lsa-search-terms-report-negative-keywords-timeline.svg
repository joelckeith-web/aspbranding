<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 405" role="img" aria-labelledby="t d" font-family="Poppins, 'Segoe UI', Arial, sans-serif">
<title id="t">The order we&#x27;d follow after your LSA account moves</title><desc id="d">Five-step timeline: save reports before the move, let the campaign settle for two weeks while building a list, add negatives, then compare photo and callout click-through rates.</desc>
<rect width="800" height="405" fill="#ffffff"/>
<text x="40" y="44" font-size="21" fill="#002366" font-weight="700" text-anchor="start">The order we&#x27;d follow after your LSA account moves</text>
<text x="40" y="70" font-size="13" fill="#4b5563" font-weight="400" text-anchor="start">Local Services Ads inside Google Ads: from saving reports to judging photos by booked jobs.</text>
<rect x="40" y="110" width="136" height="170" rx="10" fill="#ffffff" stroke="#9ca3af" stroke-width="2"/>
<rect x="40" y="110" width="136" height="8" rx="4" fill="#9ca3af"/>
<circle cx="64" cy="146" r="13" fill="#9ca3af"/>
<text x="64" y="151" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">1</text>
<text x="54" y="184" font-size="13.5" fill="#111827" font-weight="700" text-anchor="start">Before the move</text>
<text x="54" y="210.0" font-size="12" fill="#4b5563" font-weight="400" text-anchor="start">Save reports and</text><text x="54" y="226.2" font-size="12" fill="#4b5563" font-weight="400" text-anchor="start">screenshot settings</text>
<path d="M178 195 l10 0" stroke="#9ca3af" stroke-width="2"/>
<rect x="190" y="110" width="136" height="170" rx="10" fill="#ffffff" stroke="#002366" stroke-width="2"/>
<rect x="190" y="110" width="136" height="8" rx="4" fill="#002366"/>
<circle cx="214" cy="146" r="13" fill="#002366"/>
<text x="214" y="151" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">2</text>
<text x="204" y="184" font-size="13.5" fill="#111827" font-weight="700" text-anchor="start">Move day</text>
<text x="204" y="210.0" font-size="12" fill="#4b5563" font-weight="400" text-anchor="start">Campaign arrives in</text><text x="204" y="226.2" font-size="12" fill="#4b5563" font-weight="400" text-anchor="start">Google Ads, still</text><text x="204" y="242.4" font-size="12" fill="#4b5563" font-weight="400" text-anchor="start">keywordless</text>
<path d="M328 195 l10 0" stroke="#9ca3af" stroke-width="2"/>
