<text x="654" y="184" font-size="13.5" fill="#111827" font-weight="700" text-anchor="start">Ongoing</text>
<text x="654" y="210.0" font-size="12" fill="#4b5563" font-weight="400" text-anchor="start">Compare CTR by</text><text x="654" y="226.2" font-size="12" fill="#4b5563" font-weight="400" text-anchor="start">image and callout,</text><text x="654" y="242.4" font-size="12" fill="#4b5563" font-weight="400" text-anchor="start">judge by booked jobs</text>
<path d="M340 302 v8 h136 v-8" fill="none" stroke="#9F4CFF" stroke-width="1.5"/>
<text x="408.0" y="328" font-size="11" fill="#9F4CFF" font-weight="600" text-anchor="middle">Google: up to two weeks to stabilize</text>
<text x="40" y="372" font-size="11" fill="#4b5563" font-weight="400" text-anchor="start" font-style="italic">Illustrative; steps are not to scale. Two-week timing from Google&#x27;s help page and Google&#x27;s</text>
<text x="40" y="390" font-size="11" fill="#4b5563" font-weight="400" text-anchor="start" font-style="italic">Home Services Summit advice (no changes for two weeks after the move).</text>
