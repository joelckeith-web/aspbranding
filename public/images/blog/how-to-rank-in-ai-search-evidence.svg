<text x="54" y="255.0" font-size="12.5" fill="#111827" font-weight="600">Indexed pages with snippets</text>
<text x="54" y="272.5" font-size="11" fill="#6b7280">Google's entry rule for AI Overviews</text>
<text x="54" y="287.5" font-size="11" fill="#6b7280">and AI Mode</text>
<rect x="40" y="318" width="230" height="77" rx="8" fill="#1E5BD8" fill-opacity="0.08" stroke="#1E5BD8" stroke-width="1.2"/>
<text x="54" y="340.0" font-size="12.5" fill="#111827" font-weight="600">Current Business Profile</text>
<text x="54" y="357.5" font-size="11" fill="#6b7280">Google says it can help in AI</text>
<text x="54" y="372.5" font-size="11" fill="#6b7280">responses</text>
<rect x="40" y="403" width="230" height="79" rx="8" fill="#1E5BD8" fill-opacity="0.08" stroke="#1E5BD8" stroke-width="1.2"/>
<text x="54" y="425.0" font-size="12.5" fill="#111827" font-weight="600">Content from first-hand</text>
