<text x="544" y="219.0" font-size="11" fill="#6b7280">results</text>
<rect x="530" y="250" width="230" height="79" rx="8" fill="#ffffff" fill-opacity="1" stroke="#9ca3af" stroke-width="1.2" stroke-dasharray="6 5"/>
<text x="544" y="272.0" font-size="12.5" fill="#111827" font-weight="600">A reliable way to get</text>
