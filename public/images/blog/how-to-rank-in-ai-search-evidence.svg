<text x="54" y="512.0" font-size="12.5" fill="#111827" font-weight="600">Internal links</text>
<text x="54" y="529.5" font-size="11" fill="#6b7280">Listed among SEO basics that still</text>
<text x="54" y="544.5" font-size="11" fill="#6b7280">apply</text>
