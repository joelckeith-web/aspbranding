<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 478" role="img" aria-labelledby="t d" font-family="Poppins, 'Segoe UI', Arial, sans-serif">
<title id="t">How often local searches named a tracked business</title>
<desc id="d">Bar chart: Google Maps named a tracked business in 66% of searches versus 32-38% for AI surfaces; repeat AI searches overlapped only 21-33%. BrightLocal, Sep 2026.</desc>
<rect width="800" height="478" fill="#ffffff"/>
<text x="40" y="44" font-size="21" font-weight="700" fill="#002366">How often local searches named a tracked business</text>
<text x="40" y="88" font-size="14" font-weight="700" fill="#111827">Share of searches naming a tracked business</text>
<text x="160" y="122" font-size="13" fill="#1f2937" text-anchor="end">Google Maps</text>
<rect x="170" y="104" width="349.8" height="26" rx="4" fill="#9F4CFF"/>
<text x="527.8" y="122" font-size="13" font-weight="600" fill="#111827">66%</text>
<text x="160" y="158" font-size="13" fill="#1f2937" text-anchor="end">AI Overview</text>
<rect x="170" y="140" width="201.4" height="26" rx="4" fill="#1E5BD8"/>
<text x="379.4" y="158" font-size="13" font-weight="600" fill="#111827">38%</text>
<text x="160" y="194" font-size="13" fill="#1f2937" text-anchor="end">ChatGPT</text>
<rect x="170" y="176" width="174.9" height="26" rx="4" fill="#1E5BD8"/>
<text x="352.9" y="194" font-size="13" font-weight="600" fill="#111827">33%</text>
<text x="160" y="230" font-size="13" fill="#1f2937" text-anchor="end">AI Mode</text>
<rect x="170" y="212" width="169.6" height="26" rx="4" fill="#1E5BD8"/>
<text x="347.6" y="230" font-size="13" font-weight="600" fill="#111827">32%</text>
<line x1="170" y1="98" x2="170" y2="242" stroke="#9ca3af"/>
<text x="170" y="256" font-size="11" fill="#6b7280">0%</text><text x="700" y="256" font-size="11" fill="#6b7280" text-anchor="end">100%</text>
<text x="40" y="284" font-size="14" font-weight="700" fill="#111827">Average overlap when the same search is repeated</text>
<text x="160" y="318" font-size="13" fill="#1f2937" text-anchor="end">AI Overview</text>
<rect x="170" y="300" width="174.9" height="26" rx="4" fill="#1E5BD8"/>
<text x="352.9" y="318" font-size="13" font-weight="600" fill="#111827">33%</text>
<text x="160" y="354" font-size="13" fill="#1f2937" text-anchor="end">ChatGPT</text>
<rect x="170" y="336" width="121.9" height="26" rx="4" fill="#1E5BD8"/>
<text x="299.9" y="354" font-size="13" font-weight="600" fill="#111827">23%</text>
<text x="160" y="390" font-size="13" fill="#1f2937" text-anchor="end">AI Mode</text>
<rect x="170" y="372" width="111.3" height="26" rx="4" fill="#1E5BD8"/>
<text x="289.3" y="390" font-size="13" font-weight="600" fill="#111827">21%</text>
<line x1="170" y1="294" x2="170" y2="402" stroke="#9ca3af"/>
<text x="170" y="416" font-size="11" fill="#6b7280">0%</text><text x="700" y="416" font-size="11" fill="#6b7280" text-anchor="end">100%</text>
<text x="40" y="446" font-size="11" fill="#6b7280">Source: BrightLocal Local AI Visibility Study, Sep 16, 2026. Vendor study; 200,085 localized searches, 1,300 business locations,</text>
<text x="40" y="462" font-size="11" fill="#6b7280">not specific to home services.</text>
</svg>