<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" role="img" aria-labelledby="t d" font-family="Poppins, 'Segoe UI', Arial, sans-serif">
<title id="t">How the 20-second clock runs on a missed call</title><desc id="d">Flow chart of Google&#x27;s 20-second rule for missed Local Services Ads calls: no menu, phone menu with first key press, and voicemail, showing which calls are charged.</desc>
<rect width="800" height="480" fill="#ffffff"/>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#4b5563"/></marker></defs>
<text x="40" y="44" font-size="21" fill="#002366" font-weight="700" text-anchor="start">How the 20-second clock runs on a missed call</text>
<text x="40" y="70" font-size="13" fill="#4b5563" font-weight="400" text-anchor="start">Google&#x27;s rule only covers calls nobody answers. A phone menu restarts the clock at the first key press.</text>
<rect x="250" y="90" width="300" height="42" rx="8" fill="#f3f4f6" stroke="#002366" stroke-width="2"/>
<text x="400.0" y="110" font-size="12" fill="#111827" font-weight="400" text-anchor="middle">Missed call during business hours</text>
<text x="400.0" y="126" font-size="12" fill="#111827" font-weight="400" text-anchor="middle">(and inside your ad schedule)</text>
<line x1="400" y1="132" x2="140" y2="160" stroke="#4b5563" stroke-width="1.5" marker-end="url(#ah)"/>
<rect x="40" y="162" width="200" height="30" rx="8" fill="#ffffff" stroke="#002366" stroke-width="2"/>
<text x="140.0" y="182" font-size="12" fill="#111827" font-weight="700" text-anchor="middle">No phone menu</text>
<line x1="400" y1="132" x2="390" y2="160" stroke="#4b5563" stroke-width="1.5" marker-end="url(#ah)"/>
<rect x="290" y="162" width="200" height="30" rx="8" fill="#ffffff" stroke="#002366" stroke-width="2"/>
<text x="390.0" y="182" font-size="12" fill="#111827" font-weight="700" text-anchor="middle">Phone menu plays</text>
<line x1="400" y1="132" x2="660" y2="160" stroke="#4b5563" stroke-width="1.5" marker-end="url(#ah)"/>
<rect x="560" y="162" width="200" height="30" rx="8" fill="#ffffff" stroke="#002366" stroke-width="2"/>
<text x="660.0" y="182" font-size="12" fill="#111827" font-weight="700" text-anchor="middle">Voicemail or greeting</text>
<line x1="140" y1="192" x2="140" y2="214" stroke="#4b5563" stroke-width="1.5" marker-end="url(#ah)"/>
<rect x="40" y="216" width="200" height="46" rx="8" fill="#ffffff" stroke="#1E5BD8" stroke-width="2"/>
<text x="140.0" y="236" font-size="12" fill="#111827" font-weight="400" text-anchor="middle">Caller stays on more</text>
<text x="140.0" y="252" font-size="12" fill="#111827" font-weight="400" text-anchor="middle">than 20 seconds</text>
<line x1="140" y1="262" x2="140" y2="310" stroke="#4b5563" stroke-width="1.5" marker-end="url(#ah)"/>
<rect x="40" y="312" width="200" height="32" rx="8" fill="#fef2f2" stroke="#b91c1c" stroke-width="2"/>
<text x="140.0" y="332" font-size="12" fill="#111827" font-weight="700" text-anchor="middle">Charged lead</text>
<line x1="340" y1="192" x2="330" y2="214" stroke="#4b5563" stroke-width="1.5" marker-end="url(#ah)"/>
<rect x="250" y="216" width="150" height="62" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="2"/>
<text x="325.0" y="236" font-size="12" fill="#111827" font-weight="400" text-anchor="middle">Hangs up before</text>
<text x="325.0" y="252" font-size="12" fill="#111827" font-weight="400" text-anchor="middle">pressing a key</text>
<line x1="325" y1="278" x2="325" y2="310" stroke="#4b5563" stroke-width="1.5" marker-end="url(#ah)"/>
<rect x="250" y="312" width="150" height="48" rx="8" fill="#f0fdfa" stroke="#0f766e" stroke-width="2"/>
<text x="325.0" y="332" font-size="11.5" fill="#111827" font-weight="700" text-anchor="middle">Not charged, even if</text>
<text x="325.0" y="348" font-size="11.5" fill="#111827" font-weight="400" text-anchor="middle">menu ran over 20 s</text>
<line x1="440" y1="192" x2="480" y2="214" stroke="#4b5563" stroke-width="1.5" marker-end="url(#ah)"/>
<rect x="410" y="216" width="140" height="78" rx="8" fill="#ffffff" stroke="#1E5BD8" stroke-width="2"/>
<text x="480.0" y="236" font-size="11.5" fill="#111827" font-weight="400" text-anchor="middle">Presses first key:</text>
<text x="480.0" y="252" font-size="11.5" fill="#111827" font-weight="400" text-anchor="middle">timer resets.</text>
<text x="480.0" y="268" font-size="11.5" fill="#111827" font-weight="400" text-anchor="middle">Later presses</text>
<text x="480.0" y="284" font-size="11.5" fill="#111827" font-weight="400" text-anchor="middle">don&#x27;t reset it</text>
<line x1="480" y1="294" x2="480" y2="310" stroke="#4b5563" stroke-width="1.5" marker-end="url(#ah)"/>
<rect x="410" y="312" width="140" height="48" rx="8" fill="#fef2f2" stroke="#b91c1c" stroke-width="2"/>
<text x="480.0" y="332" font-size="11.5" fill="#111827" font-weight="700" text-anchor="middle">More than 20 s after</text>
<text x="480.0" y="348" font-size="11.5" fill="#111827" font-weight="400" text-anchor="middle">first press: charged</text>
<line x1="660" y1="192" x2="660" y2="214" stroke="#4b5563" stroke-width="1.5" marker-end="url(#ah)"/>
<rect x="560" y="216" width="200" height="46" rx="8" fill="#ffffff" stroke="#1E5BD8" stroke-width="2"/>
<text x="660.0" y="236" font-size="12" fill="#111827" font-weight="400" text-anchor="middle">Caller stays on more than</text>
<text x="660.0" y="252" font-size="12" fill="#111827" font-weight="400" text-anchor="middle">20 seconds, message or not</text>
<line x1="660" y1="262" x2="660" y2="310" stroke="#4b5563" stroke-width="1.5" marker-end="url(#ah)"/>
<rect x="560" y="312" width="200" height="48" rx="8" fill="#fef2f2" stroke="#b91c1c" stroke-width="2"/>
<text x="660.0" y="332" font-size="12" fill="#111827" font-weight="700" text-anchor="middle">Charged as a</text>
<text x="660.0" y="348" font-size="12" fill="#111827" font-weight="400" text-anchor="middle">connected call</text>
<rect x="40" y="384" width="330" height="48" rx="8" fill="#f0fdfa" stroke="#0f766e" stroke-width="2"/>
<text x="205.0" y="404" font-size="11.5" fill="#111827" font-weight="400" text-anchor="middle">Someone answers? Ring time doesn&#x27;t count.</text>
<text x="205.0" y="420" font-size="11.5" fill="#111827" font-weight="400" text-anchor="middle">The call is judged on the conversation.</text>
<rect x="400" y="384" width="360" height="48" rx="8" fill="#fffbeb" stroke="#b45309" stroke-width="2" stroke-dasharray="6 5"/>
<text x="580.0" y="404" font-size="11.5" fill="#111827" font-weight="400" text-anchor="middle">Summit takeaway, not Google&#x27;s help page: hold music</text>
<text x="580.0" y="420" font-size="11.5" fill="#111827" font-weight="400" text-anchor="middle">past 20 s before pickup will likely count as missed.</text>
<text x="40" y="462" font-size="11" fill="#4b5563" font-weight="400" text-anchor="start" font-style="italic">Source: Google Local Services Help, &quot;How leads work,&quot; checked November 16, 2026. Process diagram; no data plotted.</text>
</svg>
